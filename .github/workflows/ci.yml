name: CI

# Every action is pinned to a commit SHA, with the release it resolves to
# in a trailing comment (repo hygiene, 2026-10-05). The deploy job holds the
# Cloudflare secrets, and a mutable tag (`@v4`) lets whoever controls that
# tag change what runs with them; a SHA cannot move. Renew a pin by resolving
# the tag again (`gh api repos/<owner>/<repo>/git/ref/tags/<tag>`, then
# `git/tags/<sha>` when the ref is an annotated tag) and updating both the
# SHA and the comment. The runner image is pinned for the same reason:
# `ubuntu-latest` moves between images; `ubuntu-24.04` is the image it
# named on 2026-10-05 (actions/runner-images README). The leg in
# tools/repo-checks/test/repo-hygiene.test.ts refuses a tag, a branch, a
# short SHA, a pin with no release comment, a `-latest` runner and any
# `runs-on:` form it cannot read; a local `./` action and a digest-pinned
# `docker://` image carry their own pin and pass.
on:
  push:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      # Turborepo's content-addressed cache, persisted across CI runs so
      # unchanged workspaces are replayed, not rebuilt (ADR-0004 §2).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo run lint typecheck test

  # The composed-origin integration suite against local cross-process dev
  # (issue #3): one wrangler dev per Worker, plain HTTP at the seam.
  origin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-origin-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-origin-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The chrome checks drive a real Chromium (JS-on HUD readout, JS-off
      # functionality, beacon on visibility-hidden). The browser build is
      # cached; `playwright install` skips the download on a hit.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm --filter @pm/origin-suite exec playwright install --with-deps chromium

      - run: node tools/origin-suite/run-local.mjs

      - name: Upload dev logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: origin-dev-logs
          path: tools/origin-suite/.dev-logs/
          # The log dir is dot-prefixed; v4 excludes hidden files by default.
          include-hidden-files: true

  # Deploy to the canonical plane from main (ADR-0004 §1), then re-run the
  # suite against the REAL deployed origin, the post-deploy smoke that
  # retires the spike's one accepted residual risk (FINDINGS §5). Gated on
  # the Cloudflare secrets; skips loudly (not silently) until they exist.
  deploy:
    needs: [check, origin]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # One SHA per deploy (ADR-0004 §2): overlapping main pushes must not
    # interleave their wrangler deploys into a mixed-SHA plane. Deploys queue;
    # a superseded pending deploy is dropped in favor of the newest.
    concurrency:
      group: deploy-canonical-plane
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-origin-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-origin-${{ runner.os }}-

      # Secrets are scoped to the steps that need them, never to pnpm
      # install or builds, which execute third-party lifecycle scripts.
      - run: pnpm install --frozen-lockfile

      - name: Check deploy credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy skipped, CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets are not set. The canonical plane is not yet receiving deploys (issue #3 deploy leg; setup steps in workers/README.md)."
          fi

      - name: Build worker dists (variants + measurement bundle + front /_pm assets)
        if: steps.creds.outputs.present == 'true'
        # PM_SNAPSHOT=crate: the deployed plane serves the crate, so every
        # snapshot-parameterized (build-time) variant must bake the crate's
        # trays here. Which builds those are is DERIVABLE, deliberately not
        # enumerated in this comment: they are exactly the turbo tasks
        # declaring `env: ["PM_SNAPSHOT"]` (grep turbo.json), an enumerated
        # list goes stale the moment another build-time variant lands, and a
        # stale list here is dangerous rather than untidy: it is the evidence
        # someone would use to conclude a variant's `deploy` may safely
        # rebuild. It may not. THIS step is the only place PM_SNAPSHOT is set,
        # so a rebuild inside any `deploy` script would default to `fixture`
        # and overwrite crate-baked output moments before upload
        # (variants/astro/DIFF-TO-STARTER.md point 9; turbo.json documents the
        # cache-family hazard the env declaration exists to prevent).
        run: pnpm exec turbo run build
        env:
          PM_SNAPSHOT: crate

      - name: Seed the frozen snapshot into R2
        if: steps.creds.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter @pm/edge exec wrangler r2 bucket create pm-snapshot \
            || echo "bucket exists (a real auth failure would fail the seed below)"
          pnpm --filter @pm/edge run seed:remote

      # Service-binding targets first: the front Worker's bindings must
      # resolve. Edge deploys BEFORE any variant that binds it itself
      # (react-next, qwik, htmx, and remix3, the request-time variants,
      # editorial-build slices B, D, E, and F, bind pm-edge directly rather
      # than through the front Worker), reordered here from "edge last" once
      # such a variant existed.
      - name: Deploy service-bound Workers (edge + variants)
        if: steps.creds.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter @pm/edge run deploy
          pnpm --filter @pm/placeholder-static run deploy
          pnpm --filter @pm/placeholder-ssr run deploy
          pnpm --filter @pm/vanilla run deploy
          pnpm --filter @pm/react-next run deploy
          pnpm --filter @pm/astro run deploy
          pnpm --filter @pm/qwik run deploy
          pnpm --filter @pm/htmx run deploy
          pnpm --filter @pm/remix3 run deploy

      # The blog plane (ADR-0009): resources, then schema, then the Worker,
      # and all of it before the front Worker, whose BLOG binding must
      # resolve. Create-guards follow the pm-snapshot pattern above.
      - name: Deploy blog Worker (resources + migrations first)
        if: steps.creds.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # No d1-create guard: wrangler.jsonc pins the database id, so a
          # freshly-created db could never satisfy the binding, the migrate
          # step below is the loud failure if the database is missing.
          pnpm --filter @pm/blog exec wrangler r2 bucket create pm-blog-media \
            || echo "bucket exists (a real auth failure would fail the deploy below)"
          pnpm --filter @pm/blog run migrate:remote
          pnpm --filter @pm/blog run deploy

      - name: Deploy front Worker
        if: steps.creds.outputs.present == 'true'
        id: front
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OUT=$(pnpm --filter @pm/front run deploy)
          echo "$OUT"
          URL=$(echo "$OUT" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          if [ -z "$URL" ]; then
            echo "::error::Could not determine the deployed origin URL from wrangler output"
            exit 1
          fi
          echo "origin=$URL" >> "$GITHUB_OUTPUT"

      - name: Wait for the deployed origin to answer
        if: steps.creds.outputs.present == 'true'
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.front.outputs.origin }}/" || true)
            if [ "$CODE" = "200" ]; then echo "origin ready"; exit 0; fi
            echo "waiting ($i): got $CODE"; sleep 3
          done
          echo "::error::Deployed origin never answered 200, smoke would report a readiness race, not an architecture failure"
          exit 1

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.creds.outputs.present == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium for the smoke's browser checks
        if: steps.creds.outputs.present == 'true'
        run: pnpm --filter @pm/origin-suite exec playwright install --with-deps chromium

      - name: Post-deploy smoke (suite against the deployed origin, Brotli asserted)
        if: steps.creds.outputs.present == 'true'
        run: pnpm --filter @pm/origin-suite exec vitest run
        env:
          PM_ORIGIN: ${{ steps.front.outputs.origin }}
          PM_EXPECT_BROTLI: "1"

      # The drift gate's failure evidence (expected/actual/diff screenshots +
      # normalized-DOM extracts) is written to .dev-logs/drift/, without this
      # upload a deployed-origin drift failure would be destroyed with the
      # runner and unreproducible after the next deploy replaces the plane.
      - name: Upload smoke evidence on failure
        if: failure() && steps.creds.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-dev-logs
          path: tools/origin-suite/.dev-logs/
          include-hidden-files: true
